[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "jeffbrasil",email = "jefferson.ribeiro.brasil@ccc.ufcg.edu.br"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"

dependencies = [
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "typos (>=1.46.3,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true


[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings']

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev app/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
